name: CI

on:
  push:
  pull_request:
  workflow_dispatch:    

permissions:
  # This enables publishing the dependency graph
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up JDK 8
      uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: 'sbt'

    - name: Setup sbt launcher
      uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8

    - name: Run tests and generate coverage report
      run: sbt coverageOn scripted coverageReport

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: target/scala-2.12/sbt-1.0/coverage-report/cobertura.xml
        verbose: true

      # This step uploads information to the GitHub dependency graph and unlocks Dependabot alerts for the repository
    - name: Upload dependency graph
      uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3
      if: github.event_name != 'pull_request'
